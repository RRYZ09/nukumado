name: 💡 こうしてほしい
description: あったらうれしいもの・変えてほしいところ
title: "[ほしい] "
labels: ["ほしい"]
body:
  - type: markdown
    attributes:
      value: |
        書いてくれてありがとう。1 人で作っているので、返事はゆっくりです。ぜんぶは作れませんが、ぜんぶ読みます。
        **名前や住所など知られたくないことは書かないでください**(このページはだれでも読めます)。
  - type: dropdown
    id: kind
    attributes:
      label: どんなこと?
      options: ["ついか(新しくほしい)", "へんこう(いまのものを変えてほしい)", "そのほか"]
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: どこのこと?
      options: ["入口", "🌸 ごじあい", "🍵 ひといき", "⚙️ せってい", "🔰 はじめてのしつもん", "新しいアプリ", "そのほか"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: どうなったらうれしい?
      description: こまっている場面もあれば教えてください(「朝、◯◯のとき」のように)
    validations:
      required: true
  - type: textarea
    id: shot
    attributes:
      label: スクリーンショット・絵(あれば)
