name: 😣 こまった
description: うごかない・おかしい・わからない
title: "[こまった] "
labels: ["こまった"]
body:
  - type: markdown
    attributes:
      value: |
        書いてくれてありがとう。わかるところだけでだいじょうぶです。
        記録(スタンプや設定)はここには送られません。**名前や住所など知られたくないことは書かないでください**(このページはだれでも読めます)。
  - type: dropdown
    id: app
    attributes:
      label: どこで?
      options: ["入口", "🌸 ごじあい", "🍵 ひといき", "⚙️ せってい", "🔰 はじめてのしつもん", "そのほか・わからない"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: なにがおきた?
      description: したことと、おきたこと。「◯◯を押したら △△になった」のように
      placeholder: タイマーの「歯みがき」を押したら、画面が白いままになった
    validations:
      required: true
  - type: textarea
    id: shot
    attributes:
      label: スクリーンショット(あれば)
      description: ここに画像を貼りつけられます。知られたくないものが写っていないか見てから貼ってください
  - type: textarea
    id: env
    attributes:
      label: つかっているもの
      description: アプリの「⚙️ → このアプリについて → こまったを書く」から来たときは、自動で入ります
      placeholder: "例: Android の Chrome / iPhone の Safari"
